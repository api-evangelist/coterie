description: >-
  FinOps view of a Coterie API integration. Unlike usage-metered API products,
  Coterie does not bill partners per API call; the economic model is insurance
  commission on bound premium for appointed agents and digital partners, plus
  the underlying carrier premium, taxes, and fees collected from policyholders
  (Coterie uses Stripe for payment processing). The cost objects to track are
  therefore bound premium, commission earned, and policy counts by line of
  business rather than request or token spend. Monetary terms are negotiated per
  partner and not publicly published, so figures here are not reconciled.
notes: >-
  Track spend and revenue at the policy and premium level. Per-partner
  commission rates and carrier economics are set in the partner agreement;
  verify with Coterie during reconciliation.

meters:
- name: bound_premium
  description: Premium on policies bound through the API, by line of business (BOP, GL, PL, WC).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - lineOfBusiness
  - agency
- name: commission_earned
  description: Commission earned by the partner / agency on bound premium per negotiated terms.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - agency
- name: policies_bound
  description: Count of policies bound and issued, by line of business.
  unit: policies
  aggregation: sum
  dimensions:
  - account
  - lineOfBusiness
- name: quotes_generated
  description: Count of bindable quotes generated against applications.
  unit: quotes
  aggregation: sum
  dimensions:
  - account
  - lineOfBusiness
principles:
- name: Visibility
  description: Track bound premium, policy counts, and quote-to-bind conversion per agency and line of business.
- name: Allocation
  description: Attribute premium and commission to producers and agencies via producer / agency identifiers.
- name: Optimization
  description: Improve quote-to-bind conversion and select appropriate lines of business; reduce abandoned quotes.
- name: Accountability
  description: Reconcile commission statements against bound-premium reporting per partner agreement.
